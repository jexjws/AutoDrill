name: Pull Request Testing

on: [pull_request]

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PATH
        run: |
          if [ -d "${ANDROID_HOME}/build-tools" ]; then
            LATEST_BUILD_TOOLS=$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)
            echo "${ANDROID_HOME}/build-tools/${LATEST_BUILD_TOOLS}" >> $GITHUB_PATH
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Build mod jar
        run: |
          chmod +x ./gradlew
          ./gradlew jar
          ./gradlew deploy || echo "Deploy task skipped, desktop jar built"

      - name: Upload built jar file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-pr
          path: build/libs/*.jar
