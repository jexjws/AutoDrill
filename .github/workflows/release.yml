name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v2.1)'
        required: true
        default: 'v2.0-erekir'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK Build-Tools
        run: |
          if [ -d "${ANDROID_HOME}/build-tools" ]; then
            LATEST_BUILD_TOOLS=$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)
            echo "${ANDROID_HOME}/build-tools/${LATEST_BUILD_TOOLS}" >> $GITHUB_PATH
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build mod JARs
        run: |
          ./gradlew jar
          # Attempt Android/deploy build if Android SDK and d8 are available
          ./gradlew deploy || echo "Deploy task skipped, using desktop jar"

      - name: Determine Tag Name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: AutoDrill 埃里克尔优化版 ${{ steps.tag.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
